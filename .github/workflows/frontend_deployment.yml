name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest # Use a suitable runner environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH agent
      # This action sets up an SSH agent and adds your private key to it.
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add production host to known_hosts
      run: |
        mkdir -p ~/.ssh
        # Extract hostname from PRODUCTION_HOST and add to known_hosts to avoid host key verification prompts
        ssh-keyscan -H $(echo "${{ secrets.PRODUCTION_HOST }}" | cut -d'@' -f2) >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy Frontend via rsync
      run: |
        # The rsync command mirrors the logic in your admin/core/publisher.py
        rsync -avz --delete frontend/ ${{ secrets.PRODUCTION_HOST }}:${{ secrets.PRODUCTION_PATH }}
