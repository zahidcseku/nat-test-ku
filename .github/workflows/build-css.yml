name: Build and Deploy Frontend via FTP

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-css.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Tailwind CSS
      run: |
        cd frontend && npx tailwindcss -c tailwind.config.js -i input.css -o css/style.css --minify

    - name: Verify CSS file was created
      run: |
        if [ ! -f frontend/css/style.css ]; then
          echo "❌ CSS file was not created!"
          exit 1
        fi
        SIZE=$(wc -c < frontend/css/style.css)
        echo "✅ CSS file created successfully!"
        echo "📦 File size: $SIZE bytes"
        if [ $SIZE -lt 10000 ]; then
          echo "⚠️  Warning: CSS file seems small, build may have issues"
          exit 1
        fi

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          **/input.css
          **/tailwind.config.js
        local-dir: frontend/

    - name: Deployment summary
      run: |
        echo "## 🎉 Deployment Completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Your frontend has been deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Server:** ${{ secrets.FTP_SERVER }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Directory:** ${{ secrets.FTP_SERVER_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Files:** HTML, CSS, images, data" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 Check your website:" >> $GITHUB_STEP_SUMMARY
        echo "Visit your website URL to see the changes!" >> $GITHUB_STEP_SUMMARY
