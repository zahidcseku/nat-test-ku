name: Deploy to FTP

on:
  push:
    branches:
      - main  # change to 'master' if that's your default

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/   # web root on your host
          local-dir: ./                # what to upload from the repo
          protocol: ftp                # use 'ftps' for FTP over TLS
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            admin/
            .claude
            .pytest_cache/
            .vscode/
            images/
            intake/